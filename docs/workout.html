<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רישום אימון — לוח האימונים של שגית</title>
<link rel="stylesheet" href="css/tokens.css?v=2026-09-26-1">
<link rel="stylesheet" href="css/dashboard.css?v=2026-09-26-1">
<link rel="stylesheet" href="css/rtl.css?v=2026-09-26-1">
<link rel="stylesheet" href="css/site.css?v=2026-09-26-1">
</head>
<body>
<div class="wrap">

  <a class="backlink" href="index.html">← חזרה ללוח האימונים</a>

  <header class="top">
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1 id="workoutTitle">אימון</h1>
        <div class="subtitle" id="workoutSubtitle">3 סטים × 12 חזרות לכל תרגיל</div>
      </div>
    </div>
  </header>

  <div id="config-warning" style="display:none; margin-bottom:16px;"></div>

  <div class="panel span" id="detailsPanel" style="margin-bottom:16px;">
    <h2>פרטי האימון</h2>
    <div class="exercise-fields">
      <div class="field">
        <label for="sessionDate">תאריך</label>
        <input type="date" id="sessionDate">
      </div>
      <div class="field">
        <label>עומס פיזי כללי לאימון</label>
        <div class="loadpick" id="overallLoadPick"></div>
      </div>
    </div>
  </div>

  <div class="section-eyebrow">תרגילים</div>
  <div id="exerciseList"></div>

  <div class="section-eyebrow">תרגילי ליבה (סוף האימון)</div>
  <div id="coreList"></div>

  <div class="section-eyebrow">מתיחות</div>
  <div class="panel span" id="stretchPanel"></div>

  <div class="panel span" style="margin-top:16px;">
    <h2>הערות</h2>
    <div class="field">
      <textarea id="sessionNotes" rows="3" placeholder="איך הרגשת? הערות נוספות…"></textarea>
    </div>
  </div>

  <div style="margin-top:18px;">
    <button class="btn-primary" id="saveBtn">שמירת האימון</button>
    <div class="save-confirm" id="saveConfirm"></div>
  </div>
</div>

<script type="module" src="js/workout-page.js?v=2026-09-26-1"></script>
</body>
</html>
